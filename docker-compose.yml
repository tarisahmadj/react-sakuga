# ============================================================
# docker-compose.yml
# React (Next.js App Router) + Sakuga VFX + Existing PostgreSQL (postgres15)
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  react-sakuga:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-sakuga:latest
    container_name: react_sakuga
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - TZ=${TZ:-Asia/Jakarta}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_SECRET=${AUTH_SECRET:-change-this-to-a-secure-random-secret-key}
      - DB_HOST=${DB_HOST:-postgres15}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-sakuga_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres15:5432/sakuga_db}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./:/app
      - react_node_modules:/app/node_modules
      - react_next_cache:/app/.next
    networks:
      - default
      - infra_net
    mem_limit: 1g
    cpus: "1.5"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  react_node_modules:
  react_next_cache:

networks:
  infra_net:
    external: true
    name: docker-infra_default
